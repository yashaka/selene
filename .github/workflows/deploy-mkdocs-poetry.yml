name: Deploy Docs to Pages

env:
  # Specify Python version to quick change in the future
  # See: https://github.com/actions/setup-python/tree/main#available-versions-of-python
  PYTHON_VERSION: "3.10"


# Controls when the workflow will run
on:
  # Docs of the master branch, rebuilt on every push affecting master;
  # a new tag (e.g. 2.0.0) is published as its own docs version + 'latest'
  # alias, becoming the default version shown on the site
  push:
    branches: [ "master" ]
    tags: [ "*" ]

  # Manual deploy of any branch as any version label (rc branches, docs backfills)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. 2.0.0rc10, master, 1.x)'
        required: true
        type: string
      alias:
        description: 'Optional alias (e.g. latest)'
        required: false
        type: string
        default: ''

# GITHUB_TOKEN needs to be able to push the gh-pages branch maintained by mike
permissions:
  contents: write

jobs:
  # Versioned docs deploy via mike: every version lives in the gh-pages branch,
  # mkdocs-material renders a version selector from versions.json
  deploy-docs:
    # Deploys only on the upstream repo. To self-host versioned docs on your
    # own fork (or a GitLab Pages mirror): enable Pages from the gh-pages
    # branch and set the repository variable DOCS_DEPLOY=true
    if: github.repository_owner == 'yashaka' || vars.DOCS_DEPLOY == 'true'
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install --no-root --only docs

      # mike has to live in the same environment as mkdocs to build docs
      - name: Install mike
        run: poetry run pip install mike

      - name: Configure git author for mike
        run: |
          git config user.name "selene-docs-bot"
          git config user.email "selene-docs-bot@users.noreply.github.com"

      # Branch push -> label = branch name, no alias
      # Tag push    -> label = tag name, aliased as 'latest'
      # Dispatch    -> labels from inputs
      - name: Resolve version label and alias
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            ALIAS="${{ inputs.alias }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            ALIAS="latest"
          else
            VERSION="${{ github.ref_name }}"
            ALIAS=""
          fi
          echo "DOCS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DOCS_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      # mkdocs.yml resolves site_url from SITE_URL so that version-related
      # features (e.g. the outdated banner) work on whatever repo runs this
      - name: Point site_url at the Pages URL of this repo
        run: |
          echo "SITE_URL=https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Deploy versioned docs
        run: |
          if [ -n "$DOCS_ALIAS" ]; then
            poetry run mike deploy --push --update-aliases "$DOCS_VERSION" "$DOCS_ALIAS"
          else
            poetry run mike deploy --push "$DOCS_VERSION"
          fi

      # Site root then serves the 'latest' version by default
      - name: Set default version
        if: env.DOCS_ALIAS == 'latest'
        run: poetry run mike set-default --push latest
